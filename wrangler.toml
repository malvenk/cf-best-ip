name = "cf-best-ip"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# Worker 管理页 / API 自定义域名；不要把优选 IP 池域名绑定到 Worker
routes = [
  { pattern = "bestip.dek.pp.ua", custom_domain = true },
]

# KV namespace
[[kv_namespaces]]
binding = "KV"
id = "33241adcd0724e7f964d8699b6da62cb"

# Cron Trigger - 每 6 小时拉一次源 + 同步 DNS（偏移 15 分钟避开 hostmonit 整点更新）
[triggers]
crons = ["15 */6 * * *"]

# 非敏感变量(public,可见即可)
[vars]
CF_ZONE_ID        = "6191f43f56c6f14ddbf97f61e26fec81"
SERVICE_HOSTNAME  = "bestip.dek.pp.ua
" # Worker 管理页 / API 入口，不参与优选 IP DNS 同步
ROOT_DOMAIN       = "dek.pp.ua
"        # 显式限制 DNS 同步根域，避免误写到其它 zone
ALLOWED_HOSTS     = "bestip.dek.pp.ua
" # 页面/API 入口 host 白名单；/health 仍允许监控访问
AUTO_RECORD_NAME  = "auto.dek.pp.ua
"   # 默认推荐优选池
CF_RECORD_NAME    = "cf.dek.pp.ua
"     # 通用优选池
CF_DNS_BY_CARRIER = "1"   # "1" = 按运营商分子域同步 (ct./cu./cm.)
CF_DNS_IPV6       = "0"   # "1" = 同步 AAAA 记录；默认关闭，避免客户端兼容性突变
DNS_TOP_N         = "10"
API_IPS_RATE_LIMIT = "60" # /api/ips 每 IP 每分钟限额；设 "0" 关闭
SUB_RATE_LIMIT     = "120" # /sub 系订阅每 IP 每分钟限额；设 "0" 关闭
# API_IPS_REQUIRE_TOKEN = "1" # 设 "1" 后 /api/ips 也需要 Bearer token
# ALLOW_PUBLIC_REFRESH = "1" # 不推荐；仅在你明确接受公开刷新风险时启用

# 敏感变量请用 secret 命令注入:
#   wrangler secret put CF_API_TOKEN          # Cloudflare Zone:DNS:Edit
#   wrangler secret put REFRESH_TOKEN         # 手动刷新 /api/refresh 的 Bearer token
#   wrangler secret put ADMIN_TOKEN           # /admin、/api/config、/api/diagnostics 等管理接口 Bearer token
#   wrangler secret put TELEGRAM_BOT_TOKEN    # 可选
#   wrangler secret put ECH_REPORT_TOKEN      # 可选，ECH 探测器上报 /api/ech-report 的独立 token（与 Actions secret 同值）

[[durable_objects.bindings]]
name = "REFRESH_LOCK"
class_name = "RefreshLock"

[[migrations]]
tag = "v1-refresh-lock"
new_sqlite_classes = ["RefreshLock"]
